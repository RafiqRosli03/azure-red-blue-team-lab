# Local victim stack — DVWA + OWASP Juice Shop.
#
# Fallback for when the Azure victim VM is blocked (new-subscription compute quota).
# Runs the SAME two intentionally vulnerable apps the Azure VM would host, so the
# attack -> detect -> respond exercises can proceed now. Attacks run from Kali (or your
# host) against these local containers; the Azure Blue Team stack (Sentinel, Log Analytics)
# still handles the control-plane detection half.
#
# Bind to 127.0.0.1 only so these deliberately vulnerable apps are NOT exposed on your LAN.
#
# Start:  docker compose up -d
# Stop:   docker compose down
# Reset:  docker compose down -v && docker compose up -d   (wipes DVWA db back to defaults)

services:
  dvwa:
    image: vulnerables/web-dvwa
    container_name: dvwa
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"      # DVWA at http://localhost:8081 (8080 was in use)

  juiceshop:
    image: bkimminich/juice-shop
    container_name: juiceshop
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"    # Juice Shop at http://localhost:3000
